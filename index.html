  {

    "mainEntity": [
      {
        "@type": "Question",
        "name": "Do I need a referral to see Dr Khatri?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — a GP referral is required for all consultations with Dr Shailesh Khatri. Your GP will assess your symptoms, arrange initial tests, and write a referral. Contact the rooms on (07) 5598 0322 with your referral to schedule an appointment at John Flynn Specialist Suites, Level 3, Suites 301–303, 42 Inland Drive, Tugun QLD 4224."
        }
      },
      {
        "@type": "Question",
        "name": "Where does Dr Khatri consult on the Gold Coast?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dr Khatri's consulting rooms are at John Flynn Specialist Suites, Level 3, Suites 301–303, 42 Inland Drive, Tugun QLD 4224. Phone: (07) 5598 0322. He holds admitting rights at John Flynn Private Hospital (Tugun) and Pindara Private Hospital (Benowa, QLD 4217)."
        }
      },
      {
        "@type": "Question",
        "name": "What is an interventional cardiologist?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "An interventional cardiologist uses catheter-based techniques to diagnose and treat heart conditions. Dr Khatri specialises in coronary angiography, angioplasty and stenting, and TAVI (transcatheter aortic valve implantation). He has performed over 15,000 procedures since establishing his Gold Coast practice in 2001."
        }
      },
      {
        "@type": "Question",
        "name": "Is emergency cardiac care available after hours on the Gold Coast?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Dr Khatri has provided a 24-hour cardiology service to the Gold Coast for over two decades. He provides emergency cardiac care including Primary PCI (heart attack treatment) at both Pindara Private Hospital and John Flynn Private Hospital. He has personally performed over 1,500 Primary PCI procedures. In a life-threatening emergency, always call 000 first."
        }
      },
      {
        "@type": "Question",
        "name": "What is TAVI and does Dr Khatri perform TAVI on the Gold Coast?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TAVI (Transcatheter Aortic Valve Implantation) is a minimally invasive procedure to replace the aortic valve via catheter, without open-heart surgery. Dr Khatri is ACOR-accredited and has performed over 400 TAVI procedures, making him one of the most experienced TAVI operators on the Gold Coast."
        }
      },
      {
        "@type": "Question",
        "name": "What are Dr Khatri's qualifications?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dr Khatri holds an MBBS from the University of Queensland (1990). He is a Fellow of the Royal Australasian College of Physicians (FRACP), Fellow of the Cardiac Society of Australia and New Zealand (FCSANZ), Member of the Society for Cardiovascular Angiography and Interventions (SCAI), and Member of the Australian Medical Association (AMA). He completed his Interventional Cardiology Fellowship at St Paul's Hospital, Vancouver, under Professor John Webb in 2001, and is ACOR-accredited to perform TAVI procedures."
        }
      },
      {
        "@type": "Question",
        "name": "Does Dr Khatri perform coronary angiography and angioplasty?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Coronary angiography and angioplasty with stenting are among Dr Khatri's core procedures. He has performed over 15,000 interventional cardiology procedures on the Gold Coast including diagnostic angiography, balloon angioplasty, and drug-eluting stent implantation."
        }
      },
      {
        "@type": "Question",
        "name": "Which hospitals does Dr Khatri operate at on the Gold Coast?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dr Khatri holds admitting rights at John Flynn Private Hospital (42 Inland Drive, Tugun QLD 4224) and Pindara Private Hospital (Allchurch Avenue, Benowa QLD 4217). His consulting rooms are at John Flynn Specialist Suites, Level 3, Suites 301–303, 42 Inland Drive, Tugun."
        }
      }
