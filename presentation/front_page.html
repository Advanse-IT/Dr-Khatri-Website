<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
      /* Remove default body margin so the slide sits flush and loses the 8px top offset */
      body { margin: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        box-sizing: border-box;
        background: #F8F9FA;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #2D3748;
        font-family: 'Inter', sans-serif;
        position: relative;
      }
      /* Slightly wider content area so the large title fits on one line (reduces vertical span) */
      .content-wrapper {
        width: 1160px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 0; /* reduced inner padding */
      }
      /* Reduce rule vertical spacing to save height */
      .rule {
        width: 100%;
        height: 1px;
        background: #2B6CB0;
        margin: 24px 0;
      }
      .title {
        font-family: 'Playfair Display', serif;
        font-size: 64px;
        color: #1A365D;
        font-weight: 500;
        margin-bottom: 20px;
        line-height: 1.2;
      }
      .subtitle {
        font-size: 32px;
        font-weight: 300;
        color: #2B6CB0;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-top: 6px;
      }
      .footer-info {
        font-size: 20px;
        font-weight: 300;
        margin-top: 12px;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="rule"></div>
            <h1 class="title">Dr. Shailesh Khatri: SEO Excellence Strategy</h1>
            <p class="subtitle">Summary of Audit &amp; Keyword Dominance</p>
            <p class="footer-info">May 2026 | Verified 100% Excellence Status</p>
            <div class="rule"></div>
        </div>
    </div>
</body>
</html>
